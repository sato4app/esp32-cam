; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = esp32-cam
description = ESP32-CAMの映像をWi-Fi経由でスマホに表示し、microSDに写真・動画を保存する

[env:esp32cam]
platform = espressif32
; AI Thinker ESP32-CAM（PSRAM 4MB・OV2640・microSDスロット付き）
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; ESP32-CAM-MB（USB書き込み基板）はDTR/RTSでリセットされるため、モニタ中は触らない
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; Bluetoothで受け取ったWi-Fiの設定をBluetoothのタスク内で保存するので、スタックを増やす（標準4096）
    -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
; アドレスをBluetoothで知らせるのに使う（標準のBLEライブラリよりFlash・RAMの使用量が少ない）
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
; スマホ用の画面（HTML）をファームに埋め込む
board_build.embed_txtfiles =
    web/index.html
